<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="invBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="60%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Box Background -->
  <rect x="32" y="32" width="448" height="448" rx="120" ry="120" fill="url(#invBg)"/>
  <rect x="32" y="32" width="448" height="448" rx="120" ry="120" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>

  <!-- 3D Isometric Inventory Box (Primary Main Box) -->
  <!-- Top Face -->
  <polygon points="256,120 380,185 256,250 132,185" fill="url(#boxTop)"/>
  <!-- Left Face -->
  <polygon points="132,185 256,250 256,380 132,315" fill="url(#boxLeft)"/>
  <!-- Right Face -->
  <polygon points="256,250 380,185 380,315 256,380" fill="url(#boxRight)"/>

  <!-- Package Sealing Tape Accent -->
  <polygon points="256,120 286,136 162,201 132,185" fill="#fef3c7" opacity="0.85"/>
  <polygon points="256,250 286,234 286,364 256,380" fill="#d97706" opacity="0.85"/>

  <!-- Glowing Upward Inventory Stock-In Flow Arrow -->
  <path d="M 120 380 L 220 280 L 280 340 L 400 200" fill="none" stroke="url(#arrowGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#boxGlow)"/>
  <path d="M 335 200 L 400 200 L 400 265" fill="none" stroke="url(#arrowGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
