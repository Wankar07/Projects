spring.application.name=SIM_dashboard

spring.datasource.url=${DB_URL:jdbc:h2:mem:simd_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-at-least-32-chars-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${PORT:8080}

# Server-side AI configuration. Never expose this key in the React application.
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-sol}
